<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابعة الأدوية - iOS Medical Style</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial;
            background-color: #f2f7fb;
            margin: 0;
            padding: 20px;
            color: #2c3e50;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid #e3edf5;
        }

        h1 {
            text-align: center;
            color: #007aff;
            margin-bottom: 5px;
            font-size: 2em;
            font-weight: 700;
        }

        h2 {
            margin-top: 25px;
            color: #005bb5;
            font-size: 1.3em;
            font-weight: 600;
        }

        .med-entry {
            display: grid;
            grid-template-columns: 1fr 1.5fr auto;
            gap: 10px;
            padding: 15px;
            border-radius: 16px;
            background: #ffffff;
            border: 1px solid #d6e4f0;
            margin-bottom: 12px;
            transition: 0.2s;
        }

        .med-entry:hover {
            background: #f7fbff;
        }

        .med-entry.taken strong,
        .med-entry.taken span {
            text-decoration: line-through;
            color: #c62828;
        }

        .log-btn {
            padding: 10px 14px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: white;
            font-weight: 600;
            font-size: 0.95em;
            transition: 0.2s;
        }

        .taken-btn { background-color: #34c759; } /* Apple green */
        .not-taken-btn { background-color: #8e8e93; }

        .log-btn:active {
            transform: scale(0.97);
        }

        .time-log {
            grid-column: 1 / 4;
            font-size: 0.85em;
            color: #007aff;
            margin-top: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>💊 متابعة جرعات الأدوية</h1>

    <h2>🗓️ <span id="current-date"></span></h2>

    <div id="med-list"></div>

</div>

<audio id="ding-sound">
    <source src="https://www.soundjay.com/buttons/sounds/button-16.mp3" type="audio/mpeg">
</audio>

<script>
    const dateDisplay = document.getElementById("current-date");
    const medListDiv = document.getElementById("med-list");
    const dingSound = document.getElementById("ding-sound");

    const STORAGE_STATUS = "fixedMedStatus";
    const STORAGE_TIMES = "fixedMedTimes";

    // قائمة الأدوية الثابتة
    const medications = [
        { id: "Immune-AM", name: "دواء المناعة", instructions: "حبتين صباحاً قبل الأكل" },
        { id: "Sugar-AM", name: "منظم السكر", instructions: "حبة صباحاً مع الأكل" },
        { id: "VitaminD", name: "فيتامين د", instructions: "حبة بعد الأكل يومياً" },
        { id: "Immune-PM", name: "دواء المناعة", instructions: "حبتين مساءً قبل الأكل" },
        { id: "Sugar-PM", name: "منظم السكر", instructions: "حبة مساءً مع الأكل" }
    ];

    function updateClock() {
        const now = new Date();
        dateDisplay.textContent = now.toLocaleString("ar-EG");
    }
    setInterval(updateClock, 1000);
    updateClock();

    function loadStatus() {
        const stored = localStorage.getItem(STORAGE_STATUS);
        return stored ? JSON.parse(stored) : {};
    }

    function saveStatus(obj) {
        localStorage.setItem(STORAGE_STATUS, JSON.stringify(obj));
    }

    function loadTimes() {
        const stored = localStorage.getItem(STORAGE_TIMES);
        return stored ? JSON.parse(stored) : {};
    }

    function saveTimes(obj) {
        localStorage.setItem(STORAGE_TIMES, JSON.stringify(obj));
    }

    function renderMedications() {
        const status = loadStatus();
        const times = loadTimes();

        medListDiv.innerHTML = "";

        medications.forEach(med => {
            const isTaken = status[med.id] || false;
            const time = times[med.id] || "";

            const entry = document.createElement("div");
            entry.className = "med-entry" + (isTaken ? " taken" : "");

            entry.innerHTML = `
                <strong>${med.name}</strong>
                <span>${med.instructions}</span>

                <button class="log-btn ${isTaken ? "taken-btn" : "not-taken-btn"}"
                        onclick="toggleTaken('${med.id}')">
                    ${isTaken ? "تم التناول" : "لم يتناول"}
                </button>

                <div class="time-log">${time ? "⏱ " + time : ""}</div>
            `;

            medListDiv.appendChild(entry);
        });
    }

    function toggleTaken(id) {
        const status = loadStatus();
        const times = loadTimes();

        const newState = !status[id];
        status[id] = newState;
        saveStatus(status);

        if (newState) {
            const now = new Date();
            const formatted = now.toLocaleTimeString("ar-EG");
            times[id] = formatted;
            saveTimes(times);

            dingSound.play();
        } else {
            delete times[id];
            saveTimes(times);
        }

        renderMedications();
    }

    renderMedications();
</script>

</body>
</html>
